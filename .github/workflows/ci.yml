name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Testes
        run: python -m pytest tests -q
      - name: Verificar a partir do código-fonte
        run: python peculium.py --verificar

  # O cofre é a parte que não pode falhar em silêncio: se o formato do arquivo
  # mudar sem querer, um cofre gravado por esta versão precisa continuar abrindo.
  e2e:
    runs-on: windows-latest
    needs: testes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Instalar Playwright
        working-directory: tests-e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Testes de interface
        working-directory: tests-e2e
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: tests-e2e/playwright-report
          retention-days: 7

  executavel:
    runs-on: windows-latest
    needs: [testes, e2e]
    # O GITHUB_TOKEN padrão é somente-leitura para conteúdo: sem isto, anexar o
    # executável ao release devolve 403 "Resource not accessible by integration".
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Empacotar
        run: python -m PyInstaller --clean --noconfirm Peculium.spec
      - name: Conferir o pacote gerado
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter "*.exe" | Select-Object -First 1
          # O binário é de subsistema gráfico: o operador de chamada NÃO espera
          # por ele e $LASTEXITCODE viria de outro comando. E, sem console, o
          # laudo só existe no arquivo que o próprio programa grava.
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--verificar" `
                             -Wait -PassThru
          $laudo = Join-Path $exe.DirectoryName "peculium-verificacao.txt"
          if (Test-Path $laudo) { Get-Content $laudo } else { Write-Host "sem laudo" }
          if ($p.ExitCode -ne 0) {
            throw "o executável não passou na verificação (código $($p.ExitCode))"
          }
          # O `EXE()` do PyInstaller lê os extras de **kwargs e IGNORA EM SILÊNCIO
          # o nome que não conhece: `version_file=` em vez de `version=` gerou um
          # binário com todos os campos vazios e nenhuma linha de aviso no log.
          # Sem metadado o Explorer mostra "Publicador desconhecido" e nem o nome
          # do programa — é o que sobra de reputação num binário sem assinatura.
          $v = $exe.VersionInfo
          Write-Host "recurso de versão: $($v.ProductName) $($v.ProductVersion)"
          if (-not $v.ProductName -or -not $v.FileVersion) {
            throw "o executável saiu sem recurso de versão do Windows"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Peculium-exe
          path: dist/*.exe
          retention-days: 30
      - name: Anexar ao release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:GITHUB_REF_NAME (Get-ChildItem dist -Filter "*.exe").FullName --clobber
